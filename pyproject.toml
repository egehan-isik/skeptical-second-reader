[project]
name = "skeptical-second-reader"
version = "0.1.0"
description = "LLM-Assisted Decision Support for Financial Risk Analysis: does an LLM second reader check the evidence or defer to the ML model, even when the model is wrong?"
readme = "README.md"
authors = [
    { name = "Ragıp Egehan Işık" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# E/F: ruff defaults (style errors, undefined names, unused imports)
# I: import sorting (replaces isort)
# B: bugbear, likely bugs such as mutable default arguments (B006)
# UP: pyupgrade, modern Python 3.12 syntax
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
